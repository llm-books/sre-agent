# Synthetic production environment for the SRE agent.
#
# Six service instances of one configurable binary, a small data layer, and a
# full telemetry stack. Designed to fit a 16GB laptop: everything here idles
# well under 6GB. Bring it up with `make up`.
#
# The agent is NOT in this file. It runs separately (see agent/), against this
# environment, so the thing being observed and the thing observing stay cleanly
# separated.

# The six services all run the same image. Only ONE service (web) carries the
# build directive, so the image is built exactly once; the other five reference
# it by name. Giving all six a build + identical image tag makes Compose build
# the same image six times in parallel, and the concurrent exports collide with
# "image already exists". One builder, five consumers, avoids that.
x-service-base: &service-base
  image: sre-agent/service:local
  restart: unless-stopped
  labels:
    sreagent.collect: "true"     # promtail ships logs from labelled containers

services:
  # ---- data layer ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
    ports: ["5432:5432"]
    volumes:
      - ./env/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # ---- the six services ----------------------------------------------------
  web:
    <<: *service-base
    build: ./env/services          # the single builder of sre-agent/service:local
    environment:
      SERVICE_NAME: web
      PORT: "8080"
      DEPENDENCIES: "http://api-gateway:8080/checkout"
    ports: ["8081:8080"]
    depends_on: [api-gateway]

  api-gateway:
    <<: *service-base
    environment:
      SERVICE_NAME: api-gateway
      PORT: "8080"
      DEPENDENCIES: "http://orders:8080/checkout"
    ports: ["8082:8080"]
    depends_on: [orders]

  orders:
    <<: *service-base
    environment:
      SERVICE_NAME: orders
      PORT: "8080"
      DEPENDENCIES: "http://payments:8080/checkout,http://inventory:8080/checkout"
    ports: ["8083:8080"]
    depends_on: [payments, inventory]

  payments:
    <<: *service-base
    environment:
      SERVICE_NAME: payments
      PORT: "8080"
    ports: ["8084:8080"]

  inventory:
    <<: *service-base
    environment:
      SERVICE_NAME: inventory
      PORT: "8080"
    ports: ["8085:8080"]

  notifications:
    <<: *service-base
    environment:
      SERVICE_NAME: notifications
      PORT: "8080"
      ROLE: worker            # drains a queue; the silent-failure target
    ports: ["8086:8080"]

  # ---- telemetry -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./env/telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./env/telemetry/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./env/telemetry/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./env/telemetry/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, tempo]

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./env/telemetry/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports: ["3100:3100"]

  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./env/telemetry/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  tempo:
    image: grafana/tempo:2.6.0
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./env/telemetry/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports: ["3200:3200", "4317:4317", "4318:4318"]

  # ---- load ----------------------------------------------------------------
  load:
    image: grafana/k6:0.53.0
    restart: unless-stopped       # k6 exits after its ramp; restart for steady load
    command: run /scripts/load.js
    environment:
      WEB_URL: http://web:8080
    volumes:
      - ./env/load:/scripts:ro
    depends_on: [web]

  # ---- chaos (on demand) ---------------------------------------------------
  # Not started by `make up`. Invoked via `docker compose run --rm chaos ...`,
  # which the Makefile wraps as `make chaos-day` and friends.
  chaos:
    build: ./env/chaos
    image: sre-agent/chaos:local
    profiles: ["tools"]
    volumes:
      - ./env/scenarios:/scenarios:ro
