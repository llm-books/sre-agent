# Promtail ships container stdout to Loki using Docker service discovery via the
# mounted Docker socket. This works on Docker Desktop without touching host log
# paths. Only the synthetic-environment containers are kept; telemetry infra
# logs are dropped to reduce noise.
server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
      - source_labels: ["__meta_docker_container_label_sreagent_collect"]
        regex: "true"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
