global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: services
    static_configs:
      - targets:
          - web:8080
          - api-gateway:8080
          - orders:8080
          - payments:8080
          - inventory:8080
          - notifications:8080
        labels:
          env: synthetic

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
