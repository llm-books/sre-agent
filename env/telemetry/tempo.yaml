# Minimal single-binary Tempo. Trace ingestion is wired and ready; the services
# start emitting traces in the chapter 9 build (observability). Until then Tempo
# runs empty, which is fine. The agent's own traces also land here once the
# chapter 9 checkpoint adds OpenTelemetry to the agent.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
